[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitscheck"
version = "0.1.0"
description = "Units and dimensions checker for school physics and maths."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
